<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Soop embedded - demo dashboard</title>
<!--
  A stand-in for one of the dashboards Soop plugs into. Its only job is to be
  honest about the shape of the integration: a column on the right, an iframe in
  it, and a host page that hands over an identity it already has.

  Open it from the SAME origin you added to EMBED_ORIGINS in js/config.js. Served
  from anywhere else the panel will refuse, which is the point of the allowlist.
-->
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f4f5f7; color: #14161a;
  }
  @media (prefers-color-scheme: dark) { body { background: #101215; color: #e7e9ee; } }
  main { flex: 1; padding: 32px 40px; min-width: 0; overflow: auto; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  p.sub { margin: 0 0 28px; opacity: .7; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .card {
    background: #fff; border: 1px solid #e2e5ea; border-radius: 10px; padding: 16px;
  }
  @media (prefers-color-scheme: dark) { .card { background: #191c21; border-color: #262a31; } }
  .card b { display: block; font-size: 26px; margin-bottom: 2px; }
  .card span { opacity: .65; font-size: 13px; }

  #dock {
    width: 400px; flex: none; display: flex; flex-direction: column;
    border-left: 1px solid #d8dce2; background: #fff;
  }
  @media (prefers-color-scheme: dark) { #dock { border-color: #262a31; background: #16181c; } }
  #dockbar {
    display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px;
    border-bottom: 1px solid #e2e5ea; font-size: 13px; font-weight: 600;
  }
  @media (prefers-color-scheme: dark) { #dockbar { border-color: #262a31; } }
  #dockbar .sp { flex: 1; }
  #badge {
    min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px;
    background: #e5484d; color: #fff; font-size: 11px; font-weight: 800;
    display: none; place-items: center;
  }
  #dockbody { flex: 1; min-height: 0; }
  button.mini {
    font: inherit; font-size: 12px; padding: 3px 8px; border-radius: 6px;
    border: 1px solid #ccd1d9; background: transparent; color: inherit; cursor: pointer;
  }
  #log {
    font: 11.5px/1.5 ui-monospace, Menlo, Consolas, monospace;
    max-height: 148px; overflow: auto; border-top: 1px solid #e2e5ea;
    padding: 8px 12px; white-space: pre-wrap; opacity: .8;
  }
  @media (prefers-color-scheme: dark) { #log { border-color: #262a31; } }
</style>
</head>
<body>

<main>
  <h1>Tech dashboard</h1>
  <p class="sub">Whatever this team's real product is. Soop is the column on the right.</p>
  <div class="cards">
    <div class="card"><b>128</b><span>Open tickets</span></div>
    <div class="card"><b>14</b><span>Deploys this week</span></div>
    <div class="card"><b>99.2%</b><span>Uptime</span></div>
    <div class="card"><b>6</b><span>On call</span></div>
  </div>
</main>

<div id="dock">
  <div id="dockbar">
    <span>Team chat</span>
    <span id="badge">0</span>
    <span class="sp"></span>
    <button class="mini" id="btnGeneral">#general</button>
    <button class="mini" id="btnDark">Theme</button>
    <button class="mini" id="btnOut">Sign out</button>
  </div>
  <div id="dockbody"></div>
  <div id="log">waiting for the panel…</div>
</div>

<script src="./embed.js"></script>
<script>
  const logEl = document.getElementById('log');
  const log = (...a) => {
    logEl.textContent = a.map((x) => typeof x === 'string' ? x : JSON.stringify(x)).join(' ')
      + '\n' + logEl.textContent;
  };

  const soop = Soop.mount({
    el: '#dockbody',
    // The dashboard is team-specific, so it names its team's server. Either the
    // Space id or its name.
    space: new URLSearchParams(location.search).get('space') || 'Tech',
    chrome: 'minimal',

    // THE ONLY PART A REAL DASHBOARD HAS TO WRITE.
    //
    // Runs on this page and must call YOUR backend. Your backend is the only
    // party that may hold a signing secret, and it is the party that already
    // knows who is signed in here. Return either:
    //
    //   { handoff: '<single-use token from Soop\'s exchange endpoint>' }   preferred
    //   { access_token: '...', refresh_token: '...' }                     if you minted it
    //
    // This demo has no backend, so it returns nothing and the panel falls back
    // to its own sign-in card after a moment. That fallback is what a real embed
    // must never reach.
    auth: async () => {
      log('auth callback: no backend in this demo, panel will ask for a password');
      return null;
    },
  });

  soop.on('ready', (m) => log('ready', { space: m.space, needsAuth: m.needsAuth }));
  soop.on('signed-in', (m) => log('signed-in', m.userId));
  soop.on('navigated', (m) => log('navigated', m.channelName || m.channel));
  soop.on('error', (m) => log('error', m));
  soop.on('unread', ({ total }) => {
    const b = document.getElementById('badge');
    b.textContent = total;
    b.style.display = total > 0 ? 'grid' : 'none';
    log('unread', total);
  });

  document.getElementById('btnGeneral').onclick = () => soop.navigate('general');
  document.getElementById('btnOut').onclick = () => soop.signOut();
  let dark = false;
  document.getElementById('btnDark').onclick = () => {
    dark = !dark;
    soop.setTheme(dark ? 'dark' : 'light');
  };
</script>
</body>
</html>
