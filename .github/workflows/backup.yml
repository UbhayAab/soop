name: backup

on:
  schedule:
    - cron: "20 21 * * *"        # 02:50 IST daily keepalive; weekly dump below
    - cron: "50 21 * * 0"        # Sunday 02:50 IST: full logical backup
  workflow_dispatch: {}

concurrency:
  group: dek-backup
  cancel-in-progress: false

jobs:
  keepalive:
    if: github.event.schedule == '20 21 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Prove the database is reachable (and keep the free tier awake)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pg_isready "$DATABASE_URL"
          psql "$DATABASE_URL" -c "insert into private.keepalive (id) values (1) on conflict (id) do update set at = now();"

  backup:
    if: github.event.schedule == '50 21 * * 0'
    runs-on: ubuntu-latest
    steps:
      - name: Dump, compress, ship to R2
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}   # session pooler URI, role with SELECT
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}     # https://<account>.r2.cloudflarestorage.com
          R2_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: dek-backups
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
          STAMP=$(date -u +%Y%m%d-%H%M)
          FILE="dek-$STAMP.sql.gz"
          pg_dump "$DATABASE_URL" --no-owner --no-privileges | gzip -9 > "$FILE"
          aws --endpoint-url "$R2_ENDPOINT" s3 cp "$FILE" "s3://$R2_BUCKET/$FILE" \
            --access-key-id "$R2_KEY" --secret-access-key "$R2_SECRET"
          # Keep the last 12 weekly dumps; R2 lifecycle can also do this server-side.
          aws --endpoint-url "$R2_ENDPOINT" s3 ls "s3://$R2_BUCKET/" \
            --access-key-id "$R2_KEY" --secret-access-key "$R2_SECRET" \
            | sort | head -n -12 | awk '{print $4}' | while read -r old; do
              [ -n "$old" ] && aws --endpoint-url "$R2_ENDPOINT" s3 rm "s3://$R2_BUCKET/$old" \
                --access-key-id "$R2_KEY" --secret-access-key "$R2_SECRET"
            done
          echo "backed up $FILE"
