name: Backup Cron

on:
  schedule:
    - cron: '0 2 * * 1'  # Weekly, every Monday at 02:00 UTC
    - cron: '0 9 * * *'   # Daily, 09:00 UTC keepalive ping
  workflow_dispatch:

jobs:
  weekly-backup:
    if: github.event_name != 'workflow_dispatch' || github.run_number == 1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Database dump
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npx supabase db dump --schema public --file dump.sql

      - name: Upload to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          aws s3 cp dump.sql "s3://${R2_BUCKET_NAME}/ backups/$(date +%Y-%m-%d).sql"
          rm dump.sql

  daily-ping:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Keepalive ping
        run: |
          echo "Keeping backup cron alive"
          curl -f https://${{ github.repository_owner }}.github.io/health || true